<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
    <title>Защита Башни</title>
    <style>
        :root {
            --gold: #fbbf24;
            --red: #ef4444;
            --text: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            padding: 8px;
        }
        #game-wrapper {
            width: 100%;
            max-width: 420px;
            height: auto;
            display: flex;
            flex-direction: column;
            background: #1a1a2e;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 380px;
            background: #2d5a27;
        }
        #hud {
            padding: 10px 14px;
            background: #0f0f1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            border-bottom: 1px solid #2d2d45;
        }
        .hud-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.06);
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
        }
        .hud-hp { color: #ef4444; }
        .hud-gold { color: #fbbf24; }
        .hud-wave { color: #3b82f6; }
        .hud-lives { color: #f472b6; }
        .hud-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hud-btn:active { background: rgba(255,255,255,0.2); }
        #action-panel {
            padding: 14px 12px;
            background: #0f0f1e;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            border-top: 1px solid #2d2d45;
        }
        button {
            border: none;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.15s;
            position: relative;
            overflow: hidden;
        }
        button:active { transform: scale(0.94); filter: brightness(1.3); }
        .btn-upgrade {
            background: linear-gradient(145deg, #1e1e3a, #161630);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            box-shadow: 0 8px 16px -4px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            letter-spacing: 0.3px;
        }
        .btn-upgrade .icon { font-size: 22px; }
        .btn-upgrade .label { font-size: 13px; font-weight: 800; }
        .btn-upgrade .price-tag {
            font-size: 13px;
            font-weight: 900;
            color: #fbbf24;
            background: rgba(0,0,0,0.5);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(251,191,36,0.3);
        }
        .btn-shop {
            background: linear-gradient(135deg, #6d28d9, #4c1d95);
            color: #ede9fe;
            border-radius: 20px;
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 20px;
            box-shadow: 0 8px 16px -4px rgba(109,40,217,0.4);
        }
        .btn-shop .label { font-size: 11px; }
        .btn-wave {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border-radius: 20px;
            padding: 14px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 20px;
            box-shadow: 0 8px 20px -4px rgba(245,158,11,0.5);
            animation: glowPulse 2s infinite;
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 8px 20px -4px rgba(245,158,11,0.5); }
            50% { box-shadow: 0 8px 28px 0px rgba(245,158,11,0.7); }
        }
        .btn-wave:disabled { opacity: 0.4; filter: grayscale(0.6); animation: none; box-shadow: none; }
        .btn-wave .label { font-size: 11px; }
        #shop-overlay, #friends-overlay, #gameover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            z-index: 20;
            display: none;
            flex-direction: column;
            padding: 24px 18px;
            color: #fff;
            overflow-y: auto;
        }
        #shop-overlay.active, #friends-overlay.active, #gameover-overlay.active { display: flex; }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .overlay-header h2 { font-size: 24px; color: #fbbf24; }
        .shop-item, .friend-item {
            background: #1e1e32;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2d2d45;
            gap: 12px;
        }
        .shop-item button, .friend-item button { background: #7c3aed; color: #fff; padding: 10px 18px; min-height: auto; border-radius: 14px; font-weight: 700; }
        .shop-item button:disabled, .friend-item button:disabled { opacity: 0.4; }
        #gameover-overlay { text-align: center; justify-content: center; }
        #gameover-overlay h2 { font-size: 36px; color: #ef4444; margin-bottom: 16px; }
        .btn-restart, .btn-revive {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border-radius: 18px;
            margin-top: 12px;
            font-weight: 800;
        }
        .btn-revive { background: linear-gradient(135deg, #f472b6, #e11d48); color: white; }
        .btn-revive:disabled { opacity: 0.4; }
        .btn-restart { background: #334155; color: white; }
        #ref-link {
            background: #0f0f1e;
            padding: 10px;
            border-radius: 10px;
            word-break: break-all;
            font-size: 13px;
            color: #fbbf24;
            margin: 10px 0;
            display: block;
            border: 1px solid #2d2d45;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="hud">
            <div class="hud-item hud-hp">❤️ <span id="hp-text">120</span></div>
            <div class="hud-item hud-gold">💰 <span id="gold-text">250</span></div>
            <div class="hud-item hud-wave">🌊 <span id="wave-text">1</span></div>
            <div class="hud-item hud-lives">💖 <span id="lives-text">3</span></div>
            <button class="hud-btn" onclick="toggleFriends()">👫</button>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="action-panel">
            <button class="btn-upgrade" onclick="upgrade('hp')"><span class="icon">❤️</span><span class="label">Стены</span><span class="price-tag" id="cost-hp">120 💰</span></button>
            <button class="btn-upgrade" onclick="upgrade('damage')"><span class="icon">⚔️</span><span class="label">Урон</span><span class="price-tag" id="cost-dmg">150 💰</span></button>
            <button class="btn-upgrade" onclick="upgrade('speed')"><span class="icon">⏱️</span><span class="label">Скорость</span><span class="price-tag" id="cost-spd">130 💰</span></button>
            <button class="btn-shop" onclick="toggleShop()"><span>🛒</span><span class="label">Магазин</span></button>
            <button class="btn-wave" id="next-wave-btn" onclick="startWave()"><span>⚡</span><span class="label">Волна</span></button>
        </div>
        <div id="shop-overlay">
            <div class="overlay-header"><h2>🛒 Магазин</h2><button onclick="toggleShop()" style="background:rgba(255,255,255,0.1); color:#fff; padding:8px 16px; border-radius:12px;">✕</button></div>
            <div id="shop-items"></div>
        </div>
        <div id="friends-overlay">
            <div class="overlay-header"><h2>👫 Друзья</h2><button onclick="toggleFriends()" style="background:rgba(255,255,255,0.1); color:#fff; padding:8px 16px; border-radius:12px;">✕</button></div>
            <p style="font-size:14px; color:#94a3b8; margin-bottom:8px;">Пригласи друга — получите по 💖💖💖</p>
            <code id="ref-link"></code>
            <button onclick="copyRef()" style="background:#fbbf24; color:#000; width:100%; padding:12px; border-radius:14px; font-weight:700; margin-top:8px;">📋 Копировать ссылку</button>
            <p style="font-size:12px; color:#64748b; margin-top:12px;">Друзья появятся здесь позже (Firebase)</p>
        </div>
        <div id="gameover-overlay">
            <h2>💀 Поражение</h2>
            <p>Волна: <span id="lose-wave">1</span></p>
            <p>Убито: <span id="lose-kills">0</span></p>
            <button class="btn-revive" id="btn-revive" onclick="revive()">💖 Возродиться (1 жизнь)</button>
            <button class="btn-revive" id="btn-revive-ad" onclick="reviveAd()" style="background:#64748b;" disabled>📺 Смотреть рекламу (скоро)</button>
            <button class="btn-restart" onclick="restartGame()">🔄 Начать с контрольной точки</button>
        </div>
    </div>
    <script>
        // ============ КАРТИНКИ ============
        var IMG = {};
        function loadImage(src) { var img = new Image(); img.src = src; return img; }
        IMG.tower = loadImage('tower.png');
        IMG.background = loadImage('background.png');
        IMG.monsters = {
            normal: loadImage('monster.png'),
            alt: loadImage('monster_2.png'),
            fast: loadImage('monster_fast.png'),
            strong: loadImage('monster_strong.png'),
            fat: loadImage('monster_fat.png')
        };
        IMG.bosses = [
            loadImage('boss1.png'), loadImage('boss2.png'), loadImage('boss3.png'),
            loadImage('boss4.png'), loadImage('boss5.png')
        ];

        // ============ ИГРА ============
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var W = 420, H = 380;
        canvas.width = W; canvas.height = H;
        var ROAD_TOP = 100, ROAD_BOTTOM = 300, ROAD_CENTER = (ROAD_TOP+ROAD_BOTTOM)/2;

        var tower = { x:50, y:ROAD_CENTER-50, w:55, h:100, hp:120, maxHp:120, damage:12, attackSpeed:1.2, lastShot:0 };
        var miniTowers = [];
        var monsters = [];
        var bullets = [];
        var particles = [];
        var gold = 250, wave = 1, active = false, spawned = 0, toSpawn = 0, spawnTimer = 0;
        var gameOver = false, totalKills = 0, checkpoint = 1, specialUsed = false, weapon = 'normal';
        var lives = 3;
        var upgradeCosts = { hp:120, damage:150, speed:130 };
        var specials = {
            fire: { name:'Огненный шар', cost:2200, damage:55, aoe:70, unlocked:false },
            ice: { name:'Ледяная сфера', cost:2800, damage:18, slow:0.4, aoe:60, unlocked:false }
        };
        var MINI_COST = 1500, MAX_MINI = 5;
        var refLink = '';

        function Monster(type) {
            this.x = W+30; this.y = ROAD_TOP+Math.random()*(ROAD_BOTTOM-ROAD_TOP-30);
            this.size = 20; this.speed = 0.7+wave*0.08; this.hp = 25+wave*10;
            this.damage = 6+wave*1.5; this.attackCD = 0; this.type = type||'normal';
            this.anim = Math.random()*100; this.sx = 1; this.sy = 1; this.frozen = false;
            if (type==='fast') { this.speed*=1.7; this.size=16; this.hp*=0.7; }
            if (type==='strong') { this.speed*=0.7; this.hp*=1.8; this.damage*=1.5; }
            if (type==='fat') { this.speed*=0.5; this.size=26; this.hp*=2.8; }
            if (type==='boss') {
                this.size=34; this.hp=350+wave*50; this.damage=20+wave*4; this.speed=0.35;
                this.y=ROAD_CENTER; this.bossIndex = Math.min(Math.floor((wave-10)/10), 4);
            }
            this.maxHp = this.hp;
        }
        Monster.prototype.update = function(dt) {
            this.anim += dt*8;
            var spd = this.speed * (this.frozen ? specials.ice.slow : 1);
            if (this.x > tower.x+tower.w+20) {
                this.sx = 1.12; this.sy = 0.88;
                this.x -= spd*50*dt;
                if (Math.abs(this.y-ROAD_CENTER)>5) this.y += (ROAD_CENTER-this.y)*0.3*dt;
            } else {
                this.attackCD -= dt;
                if (this.attackCD <= 0) {
                    this.sx = 1.3; this.sy = 0.7;
                    var tgt = tower;
                    if (miniTowers.length && Math.random()<0.4) tgt = miniTowers[Math.floor(Math.random()*miniTowers.length)];
                    tgt.hp -= this.damage;
                    this.attackCD = 1.1;
                    spawnParticles(tgt.x+tgt.w/2, tgt.y+tgt.h/2, '#ff4444', 3);
                    if (tgt===tower && tower.hp<=0) endGame();
                    var self = this;
                    setTimeout(function(){ self.sx=1; self.sy=1; }, 150);
                } else {
                    this.sx += (1-this.sx)*5*dt;
                    this.sy += (1-this.sy)*5*dt;
                }
            }
        };
        Monster.prototype.getImage = function() {
            if (this.type==='boss') return IMG.bosses[this.bossIndex] || IMG.monsters.normal;
            return IMG.monsters[this.type] || IMG.monsters.normal;
        };
        Monster.prototype.draw = function(ctx) {
            var img = this.getImage();
            ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.sx, this.sy);
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -this.size, -this.size, this.size*2, this.size*2);
            } else {
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(0,0,this.size,0,Math.PI*2); ctx.fill();
            }
            ctx.restore();
            if (this.hp < this.maxHp) {
                ctx.fillStyle = '#1f2937'; ctx.fillRect(this.x-14, this.y-this.size-10, 28, 4);
                ctx.fillStyle = '#10b981'; ctx.fillRect(this.x-14, this.y-this.size-10, 28*(this.hp/this.maxHp), 4);
            }
        };

        function Bullet(x, y, target, dmg, type) {
            this.x=x; this.y=y; this.target=target; this.speed=280; this.dmg=dmg; this.type=type||'normal';
            this.size=type==='fire'?5:type==='ice'?4:3; this.life=3; this.trail=[];
        }
        Bullet.prototype.update = function(dt) {
            this.life-=dt; if (this.life<=0) return true;
            if (!this.target||this.target.hp<=0) return true;
            var dx=this.target.x-this.x, dy=this.target.y-this.y, dist=Math.hypot(dx,dy);
            if (dist<10) { this.hit(); return true; }
            this.trail.push({x:this.x,y:this.y,life:0.12});
            if (this.trail.length>6) this.trail.shift();
            this.x+=(dx/dist)*this.speed*dt; this.y+=(dy/dist)*this.speed*dt;
            this.trail.forEach(function(t){ t.life-=dt; });
            this.trail=this.trail.filter(function(t){ return t.life>0; });
            return false;
        };
        Bullet.prototype.hit = function() {
            this.target.hp-=this.dmg;
            spawnParticles(this.target.x,this.target.y,'#fbbf24',5);
            if (this.type==='fire') {
                var self = this;
                monsters.forEach(function(m){
                    if (m!==self.target&&Math.hypot(m.x-self.target.x,m.y-self.target.y)<specials.fire.aoe)
                        m.hp-=specials.fire.damage*0.6;
                });
            }
            if (this.type==='ice') {
                var self = this;
                monsters.forEach(function(m){
                    if (Math.hypot(m.x-self.target.x,m.y-self.target.y)<specials.ice.aoe) m.frozen=true;
                });
            }
        };
        Bullet.prototype.draw = function(ctx) {
            this.trail.forEach(function(t){
                ctx.globalAlpha=t.life/0.12*0.4;
                ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(t.x,t.y,2.5,0,Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha=1;
            ctx.fillStyle=this.type==='fire'?'#f97316':this.type==='ice'?'#60a5fa':'#fbbf24';
            ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
        };

        function Particle(x,y,col){ this.x=x;this.y=y;this.vx=(Math.random()-0.5)*120;this.vy=(Math.random()-0.5)*120;this.life=0.5;this.col=col; }
        Particle.prototype.update=function(dt){ this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt;return this.life>0; };
        Particle.prototype.draw=function(ctx){ ctx.globalAlpha=this.life/0.5;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1; };
        function spawnParticles(x,y,col,n){ for(var i=0;i<n;i++) particles.push(new Particle(x,y,col)); }

        function shoot(from, forceNormal){
            if (!monsters.length) return;
            var best=null, bestD=Infinity;
            monsters.forEach(function(m){ var d=m.x-from.x; if(d>0&&d<bestD){ bestD=d; best=m; } });
            if (!best) return;
            var dmg=from.damage||tower.damage;
            if (!forceNormal&&from===tower&&weapon!=='normal'&&!specialUsed){
                bullets.push(new Bullet(from.x+from.w,from.y+from.h/2,best,specials[weapon].damage,weapon));
                specialUsed=true;
            } else {
                bullets.push(new Bullet(from.x+from.w,from.y+from.h/2,best,dmg,'normal'));
            }
            from.lastShot=performance.now()/1000;
        }

        function spawnMonster(){
            var type='normal';
            if (wave>=10&&wave%10===0&&spawned===0) type='boss';
            else if (wave>=7&&Math.random()<0.3) type='fat';
            else if (wave>=5&&Math.random()<0.35) type=Math.random()<0.5?'fast':'strong';
            monsters.push(new Monster(type));
            spawned++;
        }

        function startWave(){ if(active||gameOver) return; active=true; toSpawn=4+wave*2; spawned=0; spawnTimer=0; specialUsed=false; document.getElementById('next-wave-btn').disabled=true; }
        function endWave(){
            active=false; wave++; gold+=Math.floor(20+wave*8);
            if (wave%10===0){ specials.fire.unlocked=true; specials.ice.unlocked=true; checkpoint=wave; }
            document.getElementById('next-wave-btn').disabled=false; updateUI(); save();
        }
        function endGame(){
            gameOver=true;
            document.getElementById('lose-wave').textContent=wave;
            document.getElementById('lose-kills').textContent=totalKills;
            document.getElementById('gameover-overlay').classList.add('active');
            updateReviveButtons();
            save();
        }
        function updateReviveButtons(){
            var btnRevive = document.getElementById('btn-revive');
            var btnAd = document.getElementById('btn-revive-ad');
            if (lives > 0) {
                btnRevive.disabled = false;
                btnRevive.textContent = '💖 Возродиться (1 жизнь)';
            } else {
                btnRevive.disabled = true;
                btnRevive.textContent = '💖 Нет жизней';
            }
            btnAd.disabled = true;
            btnAd.textContent = '📺 Смотреть рекламу (скоро)';
        }
        function revive(){
            if (lives <= 0) return;
            lives--;
            monsters = [];
            gameOver = false;
            document.getElementById('gameover-overlay').classList.remove('active');
            updateUI();
            save();
        }
        function reviveAd(){
            alert('Реклама появится позже!');
        }
        function restartGame(){
            tower.hp=tower.maxHp; gold=Math.floor(gold*0.6); wave=checkpoint;
            monsters=[]; bullets=[]; active=false; gameOver=false;
            document.getElementById('gameover-overlay').classList.remove('active');
            document.getElementById('next-wave-btn').disabled=false; updateUI(); save();
        }
        function upgrade(type){
            if(gameOver) return;
            var cost=upgradeCosts[type]; if(gold<cost) return;
            gold-=cost;
            if(type==='hp'){ tower.maxHp+=55; tower.hp=Math.min(tower.hp+55,tower.maxHp); }
            if(type==='damage') tower.damage+=6;
            if(type==='speed') tower.attackSpeed+=0.22;
            upgradeCosts[type]=Math.floor(cost*1.5); updateUI(); save();
        }
        function buyMini(){
            if(gold<MINI_COST||miniTowers.length>=MAX_MINI) return;
            gold-=MINI_COST;
            var yOff=(miniTowers.length-2)*28;
            miniTowers.push({ x:tower.x+65, y:tower.y+10+yOff, w:28, h:35, hp:45, maxHp:45, damage:tower.damage*0.65, attackSpeed:0.75, lastShot:0 });
            updateUI(); save();
        }
        function buySpecial(type){
            if(gold<specials[type].cost||!specials[type].unlocked) return;
            gold-=specials[type].cost; weapon=type; updateUI(); save();
        }
        function toggleShop(){ document.getElementById('shop-overlay').classList.toggle('active'); renderShop(); }
        function toggleFriends(){
            document.getElementById('friends-overlay').classList.toggle('active');
            document.getElementById('ref-link').textContent = refLink;
        }
        function copyRef(){
            var link = document.getElementById('ref-link').textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(function(){
                    alert('Ссылка скопирована!');
                });
            }
        }
        function renderShop(){
            var h='';
            h+='<div class="shop-item"><span><b>🔥 Огненный шар</b><br><small>1/волна • АОЕ</small></span><button onclick="buySpecial(\'fire\')" '+(specials.fire.unlocked&&gold>=specials.fire.cost?'':'disabled')+'>'+specials.fire.cost+' 💰</button></div>';
            h+='<div class="shop-item"><span><b>❄️ Ледяная сфера</b><br><small>1/волна • Замедление</small></span><button onclick="buySpecial(\'ice\')" '+(specials.ice.unlocked&&gold>=specials.ice.cost?'':'disabled')+'>'+specials.ice.cost+' 💰</button></div>';
            h+='<div class="shop-item"><span><b>🏰 Мини-башня</b><br><small>'+miniTowers.length+'/'+MAX_MINI+'</small></span><button onclick="buyMini()" '+(gold>=MINI_COST&&miniTowers.length<MAX_MINI?'':'disabled')+'>'+MINI_COST+' 💰</button></div>';
            document.getElementById('shop-items').innerHTML=h;
        }
        function updateUI(){
            document.getElementById('hp-text').textContent=Math.max(0,Math.floor(tower.hp));
            document.getElementById('gold-text').textContent=gold;
            document.getElementById('wave-text').textContent=wave;
            document.getElementById('lives-text').textContent=lives;
            document.getElementById('cost-hp').textContent=upgradeCosts.hp+' 💰';
            document.getElementById('cost-dmg').textContent=upgradeCosts.damage+' 💰';
            document.getElementById('cost-spd').textContent=upgradeCosts.speed+' 💰';
            updateReviveButtons();
        }

        function save(){
            localStorage.setItem('td_v6', JSON.stringify({
                gold:gold, wave:wave, checkpoint:checkpoint,
                towerHp:tower.hp, towerMaxHp:tower.maxHp, towerDamage:tower.damage,
                attackSpeed:tower.attackSpeed, upgradeCosts:upgradeCosts,
                specials:specials, weapon:weapon, miniTowers:miniTowers,
                lives:lives, totalKills:totalKills
            }));
        }
        function load(){
            var raw = localStorage.getItem('td_v6');
            if (!raw) raw = localStorage.getItem('td_v5');
            if (!raw) raw = localStorage.getItem('td_v4');
            if (raw) {
                try {
                    var d = JSON.parse(raw);
                    gold = d.gold || 250;
                    wave = d.wave || 1;
                    checkpoint = d.checkpoint || 1;
                    tower.hp = d.towerHp || 120;
                    tower.maxHp = d.towerMaxHp || 120;
                    tower.damage = d.towerDamage || 12;
                    tower.attackSpeed = d.attackSpeed || 1.2;
                    if (d.upgradeCosts) Object.assign(upgradeCosts, d.upgradeCosts);
                    if (d.specials) Object.assign(specials, d.specials);
                    weapon = d.weapon || 'normal';
                    lives = d.lives || 3;
                    totalKills = d.totalKills || 0;
                    if (d.miniTowers) {
                        miniTowers = [];
                        d.miniTowers.forEach(function(t,i){
                            if (i < MAX_MINI) {
                                var yOff = (i - 2) * 28;
                                miniTowers.push({
                                    x: tower.x + 65, y: tower.y + 10 + yOff,
                                    w: 28, h: 35, hp: t.hp || 45, maxHp: 45,
                                    damage: tower.damage * 0.65, attackSpeed: 0.75, lastShot: 0
                                });
                            }
                        });
                    }
                } catch(e) {}
            }
            var userId = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) ? window.Telegram.WebApp.initDataUnsafe.user.id : 'test';
            refLink = 'https://t.me/your_bot?start=' + userId;
            updateUI();
            renderShop();
        }

        function processReferral(){
            var urlParams = new URLSearchParams(window.location.search);
            var refId = urlParams.get('start');
            if (refId && refId !== 'test') {
                var userId = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) ? window.Telegram.WebApp.initDataUnsafe.user.id : null;
                if (userId && refId !== String(userId)) {
                    var usedRefs = JSON.parse(localStorage.getItem('td_refs_used') || '[]');
                    if (usedRefs.indexOf(refId) === -1) {
                        lives += 3;
                        save();
                        usedRefs.push(refId);
                        localStorage.setItem('td_refs_used', JSON.stringify(usedRefs));
                        alert('Вы перешли по реферальной ссылке! +3 💖');
                    }
                }
            }
        }

        function loop(now){
            requestAnimationFrame(loop);
            var dt=Math.min((now-(loop.last||now))/1000, 0.12);
            loop.last=now;
            if(gameOver){ draw(); return; }
            if(active&&spawned<toSpawn){ spawnTimer+=dt; if(spawnTimer>1.6){ spawnTimer=0; spawnMonster(); } }
            var sec=now/1000;
            if(sec-tower.lastShot>1/tower.attackSpeed&&monsters.length) shoot(tower);
            miniTowers.forEach(function(mt){ if(sec-mt.lastShot>1/mt.attackSpeed&&monsters.length) shoot(mt,true); });
            for(var i=bullets.length-1;i>=0;i--) if(bullets[i].update(dt)) bullets.splice(i,1);
            for(var i=monsters.length-1;i>=0;i--){
                monsters[i].update(dt);
                if(monsters[i].hp<=0){
                    gold+=monsters[i].type==='boss'?220:monsters[i].type==='fat'?32:monsters[i].type==='strong'?22:18;
                    totalKills++; spawnParticles(monsters[i].x,monsters[i].y,'#fbbf24',10);
                    monsters.splice(i,1);
                }
            }
            for(var i=particles.length-1;i>=0;i--) if(!particles[i].update(dt)) particles.splice(i,1);
            if(active&&spawned>=toSpawn&&!monsters.length) endWave();
            updateUI(); draw();
        }
        function draw(){
            ctx.clearRect(0,0,W,H);
            if (IMG.background&&IMG.background.complete) {
                ctx.drawImage(IMG.background, 0, 0, W, H);
            } else {
                ctx.fillStyle='#2d5a27'; ctx.fillRect(0,0,W,H);
            }
            if (IMG.tower&&IMG.tower.complete) {
                ctx.drawImage(IMG.tower, tower.x-5, tower.y-20, tower.w+10, tower.h+25);
            } else {
                ctx.fillStyle='#6b8e6b'; ctx.fillRect(tower.x, tower.y, tower.w, tower.h);
                ctx.fillStyle='#fbbf24'; ctx.fillRect(tower.x+10, tower.y+15, 8, 8); ctx.fillRect(tower.x+28, tower.y+15, 8, 8);
            }
            var hpW=tower.w, hpH=7, hpX=tower.x, hpY=tower.y-15;
            ctx.fillStyle='#1f2937'; ctx.fillRect(hpX,hpY,hpW,hpH);
            ctx.fillStyle='#ef4444'; ctx.fillRect(hpX,hpY,hpW*Math.max(0,tower.hp/tower.maxHp),hpH);
            miniTowers.forEach(function(mt){
                ctx.fillStyle='#6b8c6b'; ctx.fillRect(mt.x,mt.y,mt.w,mt.h);
                ctx.fillStyle='#fbbf24'; ctx.fillRect(mt.x+4,mt.y+4,4,4); ctx.fillRect(mt.x+14,mt.y+4,4,4);
            });
            monsters.forEach(function(m){ m.draw(ctx); });
            bullets.forEach(function(b){ b.draw(ctx); });
            particles.forEach(function(p){ p.draw(ctx); });
        }

        load();
        processReferral();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
