<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Защита башни</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 700px;
            background: #2d5a27;
            border: 3px solid #5c3d2e;
            border-radius: 15px;
            overflow: hidden;
        }
        /* Верхняя панель */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            color: white;
            font-size: 16px;
            z-index: 10;
            border-bottom: 2px solid #ffd700;
        }
        .gold {
            color: #ffd700;
            font-weight: bold;
        }
        /* Холст игры */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Нижняя панель */
        #action-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-wrap: wrap;
            padding: 8px;
            gap: 6px;
            z-index: 10;
            border-top: 2px solid #ffd700;
        }
        button {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1 1 auto;
            min-width: 70px;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-upgrade {
            background: #3a6b35;
            color: white;
        }
        .btn-special {
            background: #8b4513;
            color: white;
        }
        .btn-wave {
            background: #ffd700;
            color: #000;
            font-size: 16px;
        }
        .btn-shop {
            background: #6a0dad;
            color: white;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        /* Экран поражения */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #game-over-screen h2 {
            color: #ff4444;
            font-size: 32px;
            margin-bottom: 15px;
        }
        #game-over-screen p {
            color: white;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .restart-btn {
            padding: 15px 40px;
            background: #ffd700;
            color: #000;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
        }
        /* Магазин */
        #shop-panel {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            background: rgba(30,30,50,0.95);
            padding: 15px;
            display: none;
            z-index: 15;
            border-top: 2px solid #ffd700;
        }
        #shop-panel h3 {
            color: #ffd700;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <span>❤️ <span id="hp-text">100</span></span>
            <span>💰 <span class="gold" id="gold-text">200</span></span>
            <span>🌊 <span id="wave-text">1</span></span>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="action-panel">
            <button class="btn-upgrade" onclick="upgrade('hp')">❤️ Стены</button>
            <button class="btn-upgrade" onclick="upgrade('damage')">⚔️ Урон</button>
            <button class="btn-upgrade" onclick="upgrade('speed')">⏱️ Скорость</button>
            <button class="btn-shop" onclick="toggleShop()">🛒 Магазин</button>
            <button class="btn-wave" id="next-wave-btn" onclick="startWave()">⚡ Волна!</button>
        </div>
        <div id="shop-panel">
            <h3>🛒 Магазин оружия</h3>
            <div id="shop-items"></div>
        </div>
        <div id="game-over-screen">
            <h2>💀 Поражение!</h2>
            <p>Волна: <span id="lose-wave">1</span></p>
            <p>Убито: <span id="lose-kills">0</span></p>
            <button class="restart-btn" onclick="restartGame()">🔄 Начать заново</button>
        </div>
    </div>
    <script>
        // ==================== ОСНОВНЫЕ ПЕРЕМЕННЫЕ ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 400, H = 700;
        canvas.width = W;
        canvas.height = H;

        // Дорога (по центру, горизонтальная линия)
        const ROAD_Y_START = 180;
        const ROAD_Y_END = 520;
        const ROAD_X = W/2;

        // Игровые объекты
        let tower = {
            x: 80, y: 350,
            hp: 100, maxHp: 100,
            damage: 15,
            attackSpeed: 1.5, // выстрелов в секунду
            lastShotTime: 0,
            level: 1
        };

        let monsters = [];
        let bullets = [];
        let particles = [];
        let gold = 200;
        let wave = 1;
        let monstersInWave = 4;
        let monstersSpawned = 0;
        let waveActive = false;
        let gameOver = false;
        let totalKills = 0;
        let lastCheckpoint = 1; // каждые 10 волн

        // Улучшения
        let upgradeCosts = { hp: 80, damage: 100, speed: 90 };
        let specialWeapons = {
            fire: { unlocked: false, cost: 500, damage: 30, aoe: 60, name: "Огненный шар" },
            ice: { unlocked: false, cost: 800, damage: 10, slow: 0.5, aoe: 50, name: "Ледяная сфера" }
        };
        let selectedWeapon = 'normal';

        // ==================== КЛАССЫ ====================
        class Monster {
            constructor(type) {
                this.x = W + 20;
                this.y = ROAD_Y_START + Math.random() * (ROAD_Y_END - ROAD_Y_START - 40);
                this.size = 20;
                this.speed = 0.6 + Math.random() * 0.4;
                this.hp = 20 + wave * 8;
                this.maxHp = this.hp;
                this.damage = 5 + wave * 2;
                this.attackCooldown = 0;
                this.type = type || 'normal';
                this.frame = 0; // для анимации
                // Особые свойства
                if (type === 'fast') {
                    this.speed *= 1.8;
                    this.size = 16;
                    this.hp *= 0.7;
                } else if (type === 'tank') {
                    this.size = 28;
                    this.hp *= 2.5;
                    this.speed *= 0.6;
                }
                this.maxHp = this.hp;
            }
            update(dt) {
                if (this.x > ROAD_X + 40) {
                    // Идёт к дороге
                    this.x -= this.speed * 60 * dt;
                    this.frame += dt * 4;
                } else if (this.x > tower.x + 60) {
                    // Идёт вдоль дороги к башне
                    this.x -= this.speed * 60 * dt;
                    // Плавно смещается к центру дороги
                    const targetY = ROAD_Y_START + (ROAD_Y_END - ROAD_Y_START)/2;
                    if (Math.abs(this.y - targetY) > 5) {
                        this.y += (targetY - this.y) * 0.5 * dt;
                    }
                    this.frame += dt * 4;
                } else {
                    // Атакует башню
                    this.attackCooldown -= dt;
                    if (this.attackCooldown <= 0) {
                        tower.hp -= this.damage;
                        this.attackCooldown = 1.2;
                        spawnHitParticles(tower.x + 30, tower.y + 50);
                    }
                }
            }
            draw(ctx) {
                ctx.save();
                // Тень
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 6;
                // Тело (разные цвета по типу)
                if (this.type === 'fast') ctx.fillStyle = '#ff6b6b';
                else if (this.type === 'tank') ctx.fillStyle = '#8b0000';
                else if (this.type === 'boss') ctx.fillStyle = '#ff00ff';
                else ctx.fillStyle = '#c23152';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                // Глаза
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - 6, this.y - 4, 5, 0, Math.PI * 2);
                ctx.arc(this.x + 6, this.y - 4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(this.x - 6, this.y - 4, 2.5, 0, Math.PI * 2);
                ctx.arc(this.x + 6, this.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                // Полоска HP
                if (this.hp < this.maxHp) {
                    const barW = 30;
                    const barH = 4;
                    const barX = this.x - barW/2;
                    const barY = this.y - this.size - 8;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(barX, barY, barW, barH);
                    ctx.fillStyle = '#e94560';
                    ctx.fillRect(barX, barY, barW * (this.hp / this.maxHp), barH);
                }
                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, target, damage, type = 'normal') {
                this.x = x;
                this.y = y;
                this.target = target;
                this.speed = 250;
                this.damage = damage;
                this.type = type;
                this.size = type === 'fire' ? 6 : type === 'ice' ? 5 : 3;
            }
            update(dt) {
                if (!this.target || this.target.hp <= 0) return false;
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 8) {
                    this.onHit();
                    return true; // попал
                }
                this.x += (dx / dist) * this.speed * dt;
                this.y += (dy / dist) * this.speed * dt;
                return false;
            }
            onHit() {
                this.target.hp -= this.damage;
                spawnHitParticles(this.target.x, this.target.y);
                // Особые эффекты
                if (this.type === 'fire') {
                    // Урон по области
                    monsters.forEach(m => {
                        const dist = Math.hypot(m.x - this.target.x, m.y - this.target.y);
                        if (dist < specialWeapons.fire.aoe && m !== this.target) {
                            m.hp -= specialWeapons.fire.damage * 0.5;
                        }
                    });
                } else if (this.type === 'ice') {
                    // Замедление
                    this.target.speed *= specialWeapons.ice.slow;
                    setTimeout(() => { if (this.target) this.target.speed /= specialWeapons.ice.slow; }, 1500);
                }
            }
            draw(ctx) {
                ctx.fillStyle = this.type === 'fire' ? '#ff6600' : this.type === 'ice' ? '#66ccff' : '#ffd700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 100;
                this.vy = (Math.random() - 0.5) * 100;
                this.life = 0.6;
                this.maxLife = 0.6;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                return this.life > 0;
            }
            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = `rgba(255,200,0,${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
        function spawnHitParticles(x, y) {
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(x, y));
            }
        }

        function shoot() {
            if (monsters.length === 0) return;
            // Находим ближайшего монстра
            let closest = null;
            let minDist = Infinity;
            monsters.forEach(m => {
                const dist = Math.hypot(m.x - tower.x, m.y - (tower.y + 50));
                if (dist < minDist && m.x > tower.x) {
                    minDist = dist;
                    closest = m;
                }
            });
            if (!closest) return;
            const dmg = selectedWeapon === 'fire' ? specialWeapons.fire.damage :
                       selectedWeapon === 'ice' ? specialWeapons.ice.damage : tower.damage;
            bullets.push(new Bullet(tower.x + 40, tower.y + 50, closest, dmg, selectedWeapon));
            tower.lastShotTime = performance.now() / 1000;
        }

        function spawnMonster() {
            let type = 'normal';
            if (wave >= 10 && wave % 10 === 0 && monstersSpawned === 0) {
                type = 'boss'; // Босс!
            } else if (wave >= 5) {
                const r = Math.random();
                if (r < 0.3) type = 'fast';
                else if (r < 0.5) type = 'tank';
            }
            const monster = new Monster(type);
            if (type === 'boss') {
                monster.size = 40;
                monster.hp = 200 + wave * 30;
                monster.maxHp = monster.hp;
                monster.damage = 15 + wave * 3;
                monster.speed = 0.3;
                monster.y = ROAD_Y_START + (ROAD_Y_END - ROAD_Y_START)/2;
            }
            monsters.push(monster);
            monstersSpawned++;
        }

        function startWave() {
            if (waveActive || gameOver) return;
            waveActive = true;
            monstersInWave = 4 + wave * 2;
            monstersSpawned = 0;
            document.getElementById('next-wave-btn').disabled = true;
        }

        function endWave() {
            waveActive = false;
            wave++;
            gold += 30 + wave * 10;
            document.getElementById('next-wave-btn').disabled = false;
            updateHUD();
            saveGame();
            // Разблокировка оружия
            if (wave % 10 === 0 && wave > 0) {
                if (!specialWeapons.fire.unlocked) specialWeapons.fire.unlocked = true;
                else if (!specialWeapons.ice.unlocked) specialWeapons.ice.unlocked = true;
                renderShop();
            }
            // Контрольная точка
            if (wave % 10 === 0) {
                lastCheckpoint = wave;
            }
        }

        function restartGame() {
            tower.hp = tower.maxHp;
            gold = Math.floor(gold * 0.7); // Штраф 30%
            wave = lastCheckpoint;
            monsters = [];
            bullets = [];
            waveActive = false;
            gameOver = false;
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('next-wave-btn').disabled = false;
            updateHUD();
            saveGame();
        }

        function upgrade(type) {
            if (gameOver) return;
            const cost = upgradeCosts[type];
            if (gold < cost) return alert('Недостаточно золота!');
            gold -= cost;
            if (type === 'hp') {
                tower.maxHp += 50;
                tower.hp = Math.min(tower.hp + 50, tower.maxHp);
            } else if (type === 'damage') {
                tower.damage += 5;
            } else if (type === 'speed') {
                tower.attackSpeed += 0.3;
            }
            upgradeCosts[type] = Math.floor(cost * 1.5);
            updateHUD();
            saveGame();
        }

        function buyWeapon(weapon) {
            const w = specialWeapons[weapon];
            if (!w.unlocked) return alert('Ещё не открыто!');
            if (gold < w.cost) return alert('Недостаточно золота!');
            gold -= w.cost;
            selectedWeapon = weapon;
            updateHUD();
            saveGame();
        }

        function toggleShop() {
            const panel = document.getElementById('shop-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            let html = '';
            for (let key in specialWeapons) {
                const w = specialWeapons[key];
                html += `<div style="margin:8px 0;display:flex;justify-content:space-between;align-items:center;">
                    <span>${w.name} ${w.unlocked ? '✅' : '🔒'}</span>
                    <button onclick="buyWeapon('${key}')" ${!w.unlocked || gold < w.cost ? 'disabled' : ''} style="background:#8b4513;color:white;padding:6px 12px;border:none;border-radius:6px;">${w.cost} 💰</button>
                </div>`;
            }
            container.innerHTML = html || '<p style="color:gray;">Нет оружия</p>';
        }

        function updateHUD() {
            document.getElementById('hp-text').textContent = Math.max(0, tower.hp);
            document.getElementById('gold-text').textContent = gold;
            document.getElementById('wave-text').textContent = wave;
        }

        // ==================== СОХРАНЕНИЕ ====================
        function saveGame() {
            const data = { gold, wave, lastCheckpoint, towerHp: tower.hp, towerMaxHp: tower.maxHp, towerDamage: tower.damage, attackSpeed: tower.attackSpeed, upgradeCosts, specialWeapons, selectedWeapon };
            localStorage.setItem('td_save', JSON.stringify(data));
        }

        function loadGame() {
            const raw = localStorage.getItem('td_save');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    gold = data.gold || 200;
                    wave = data.wave || 1;
                    lastCheckpoint = data.lastCheckpoint || 1;
                    tower.hp = data.towerHp || 100;
                    tower.maxHp = data.towerMaxHp || 100;
                    tower.damage = data.towerDamage || 15;
                    tower.attackSpeed = data.attackSpeed || 1.5;
                    upgradeCosts = data.upgradeCosts || { hp: 80, damage: 100, speed: 90 };
                    if (data.specialWeapons) Object.assign(specialWeapons, data.specialWeapons);
                    selectedWeapon = data.selectedWeapon || 'normal';
                } catch(e) {}
            }
            updateHUD();
            renderShop();
        }

        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop(now) {
            requestAnimationFrame(gameLoop);
            const dt = Math.min((now - (gameLoop.lastTime || now)) / 1000, 0.1);
            gameLoop.lastTime = now;

            if (gameOver) return;

            // Спавн монстров
            if (waveActive && monstersSpawned < monstersInWave) {
                if (!gameLoop.spawnTimer) gameLoop.spawnTimer = 0;
                gameLoop.spawnTimer += dt;
                if (gameLoop.spawnTimer > 1.5) {
                    gameLoop.spawnTimer = 0;
                    spawnMonster();
                }
            }

            // Стрельба
            const nowSec = now / 1000;
            if (nowSec - tower.lastShotTime > 1 / tower.attackSpeed && monsters.length > 0) {
                shoot();
            }

            // Обновление пуль
            for (let i = bullets.length - 1; i >= 0; i--) {
                if (bullets[i].update(dt)) {
                    bullets.splice(i, 1);
                }
            }

            // Обновление монстров
            for (let i = monsters.length - 1; i >= 0; i--) {
                const m = monsters[i];
                m.update(dt);
                if (m.hp <= 0) {
                    gold += m.type === 'boss' ? 200 : m.type === 'tank' ? 30 : 20;
                    totalKills++;
                    // Эффект смерти
                    for (let j = 0; j < 10; j++) particles.push(new Particle(m.x, m.y));
                    monsters.splice(i, 1);
                }
            }

            // Обновление частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update(dt)) particles.splice(i, 1);
            }

            // Проверка конца волны
            if (waveActive && monstersSpawned >= monstersInWave && monsters.length === 0) {
                endWave();
            }

            // Проверка поражения
            if (tower.hp <= 0) {
                tower.hp = 0;
                gameOver = true;
                document.getElementById('lose-wave').textContent = wave;
                document.getElementById('lose-kills').textContent = totalKills;
                document.getElementById('game-over-screen').style.display = 'flex';
                saveGame();
            }

            updateHUD();
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Фон
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 0, W, H);

            // Дорога
            ctx.fillStyle = '#8b7355';
            ctx.fillRect(0, ROAD_Y_START, W, ROAD_Y_END - ROAD_Y_START);
            // Разметка
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2;
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(0, ROAD_Y_START + (ROAD_Y_END - ROAD_Y_START)/2);
            ctx.lineTo(W, ROAD_Y_START + (ROAD_Y_END - ROAD_Y_START)/2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.strokeStyle = '#5c3d2e';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, ROAD_Y_START, W, ROAD_Y_END - ROAD_Y_START);

            // Башня
            ctx.fillStyle = '#6b8e6b';
            ctx.fillRect(tower.x, tower.y, 50, 100);
            ctx.fillStyle = '#4a6741';
            ctx.fillRect(tower.x - 5, tower.y + 20, 60, 15);
            ctx.fillRect(tower.x - 5, tower.y + 60, 60, 15);
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(tower.x + 10, tower.y + 10, 10, 10);
            ctx.fillRect(tower.x + 30, tower.y + 10, 10, 10);
            // Флаг
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.moveTo(tower.x + 25, tower.y - 20);
            ctx.lineTo(tower.x + 50, tower.y - 10);
            ctx.lineTo(tower.x + 25, tower.y);
            ctx.fill();

            // HP башни
            const barW = 50;
            const barH = 6;
            const barX = tower.x;
            const barY = tower.y - 30;
            ctx.fillStyle = '#333';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#e94560';
            ctx.fillRect(barX, barY, barW * (tower.hp / tower.maxHp), barH);

            // Монстры
            monsters.forEach(m => m.draw(ctx));

            // Пули
            bullets.forEach(b => b.draw(ctx));

            // Частицы
            particles.forEach(p => p.draw(ctx));
        }

        // ==================== СТАРТ ====================
        loadGame();
        renderShop();
        gameLoop.lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
